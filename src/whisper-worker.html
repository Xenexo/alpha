<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <!--
          Hidden, non-visible window dedicated to Whisper inference on WebGPU.
          The CSP is intentionally permissive: onnxruntime-web's WebGPU backend
          compiles wasm (wasm-unsafe-eval) and spawns blob workers, transformers
          is imported as a file:// module, and model files are fetched from the
          Hugging Face CDN on first run.
        -->
        <meta
            http-equiv="content-security-policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: file:; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co data: blob:; img-src 'self' data:;"
        />
        <title>Whisper Worker</title>
    </head>
    <body>
        <script type="module" src="whisper/whisperWorker.js"></script>
    </body>
</html>
